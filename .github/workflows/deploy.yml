name: Deploy Admin to VPS (admin.sawaflix.com)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── Job 1: Build & Verify ───────────────────────────────────────────────────
  test:
    name: Build Next.js App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create production .env
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          NEXT_PUBLIC_API_URL=https://api.sawaflix.com
          NEXT_PUBLIC_BACKEND_URL=https://api.sawaflix.com
          NEXT_PUBLIC_ADMIN_BACKEND_URL=https://adminapi.sawaflix.com
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_SITE_URL=https://admin.sawaflix.com
          NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET=production
          EOF

      - name: Build
        run: npm run build

  # ─── Job 2: Deploy to VPS ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: sawaflix
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          script_stop: true

          script: |
            set -e

            # Load NVM
            export NVM_DIR="/home/sawaflix/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            # Use Node 20
            nvm use 20

            # Go to application
            cd /home/sawaflix/apps/sawaFlix-admin

            echo "Pulling latest code..."

            git fetch origin master
            git reset --hard origin/master

            echo "Installing dependencies..."

            npm install

            echo "==> Writing production .env..."
            cat > .env.production.local << 'ENVEOF'
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            NEXT_PUBLIC_API_URL=https://api.sawaflix.com
            NEXT_PUBLIC_BACKEND_URL=https://api.sawaflix.com
            NEXT_PUBLIC_ADMIN_BACKEND_URL=https://adminapi.sawaflix.com
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            NEXT_PUBLIC_SITE_URL=https://admin.sawaflix.com
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=production
            ENVEOF

            echo "Building application..."

            npm run build

            echo "Reloading PM2..."

            pm2 reload sawaflix-admin --update-env 2>/dev/null || \
              pm2 start npm --name sawaflix-admin -- start

            pm2 save

            echo "======================================"
            echo "✅ Deployment successful!"
            echo "======================================"
