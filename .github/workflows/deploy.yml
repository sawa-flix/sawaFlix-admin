name: Deploy Admin to VPS (admin.sawaflix.com)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build & Deploy Admin Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create production .env
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          NEXT_PUBLIC_API_URL=https://api.sawaflix.com
          NEXT_PUBLIC_BACKEND_URL=https://api.sawaflix.com
          NEXT_PUBLIC_ADMIN_BACKEND_URL=https://adminapi.sawaflix.com
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_SITE_URL=https://admin.sawaflix.com
          NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET=production
          EOF

      - name: Build Next.js app
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "==> Pulling latest code..."
            cd ~/apps/sawaflix-admin
            git pull origin master

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Writing production .env..."
            cat > .env.production.local << 'ENVEOF'
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            NEXT_PUBLIC_API_URL=https://api.sawaflix.com
            NEXT_PUBLIC_BACKEND_URL=https://api.sawaflix.com
            NEXT_PUBLIC_ADMIN_BACKEND_URL=https://adminapi.sawaflix.com
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            NEXT_PUBLIC_SITE_URL=https://admin.sawaflix.com
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=production
            ENVEOF

            echo "==> Building for production..."
            npm run build

            echo "==> Restarting PM2 process..."
            pm2 reload sawaflix-admin --update-env || pm2 start npm --name sawaflix-admin -- start

            echo "==> Deploy complete!"
